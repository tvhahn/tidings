ignoredBuiltDependencies:
  - esbuild
  - unrs-resolver
allowBuilds:
  esbuild: false
  unrs-resolver: false
overrides:
  esbuild: ">=0.28.1"
  js-yaml: ">=4.3.1 <5"
  undici: ">=7.29.0 <8"
  "@babel/core": ">=7.29.6 <8"
  fast-uri: ">=3.1.5 <4"
  brace-expansion@1: ">=1.1.18 <2"
  brace-expansion@2: ">=2.1.4 <3"
  minimatch@3: ">=3.1.4 <4"
  minimatch@5: ">=5.1.8 <6"
  minimatch@9: ">=9.0.7 <10"
  flatted: ">=3.4.2 <4"
  postcss: ">=8.5.23 <9"
auditConfig:
  ignoreGhsas:
    # react-router — RSC-mode CSRF bypass. Only reachable through the unstable
    # RSC APIs; this app is a plain Vite SPA on declarative <BrowserRouter> and
    # imports no unstable_/RSC entry points, so the vulnerable code path is not
    # in the bundle. The sole patched release is the react-router 8 major —
    # tracked as a follow-up upgrade rather than an emergency bump.
    - GHSA-qwww-vcr4-c8h2
