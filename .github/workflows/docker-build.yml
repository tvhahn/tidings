name: Docker multi-arch build

# On push to main: build the self-hoster images for linux/amd64 +
# linux/arm64 and push `:main` to GHCR. On PRs: build only (compile-check)
# so contributors' forks don't need GHCR write access.
#
# Coordinates with release.yml: this workflow owns `:main`; release.yml
# owns `:vX.Y.Z` and `:latest`. No race on `:latest`. See
# docs/guides/releases.md → "How the release workflow works".

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile.prod"
      - "docker/imap_polling/Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docker-build.yml"

permissions:
  contents: read
  packages: write

jobs:
  multiarch-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            dockerfile: Dockerfile.prod
            image: ghcr.io/${{ github.repository_owner }}/tidings
          - name: imap-poller
            dockerfile: docker/imap_polling/Dockerfile
            image: ghcr.io/${{ github.repository_owner }}/tidings-imap-poller
    name: build (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags + labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=ref,event=branch

      - name: Build ${{ matrix.name }} (amd64 + arm64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
