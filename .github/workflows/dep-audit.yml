name: Dependency audit

# Weekly scheduled supply-chain audit. The blocking `security-scan` job in
# ci.yml only runs on push/PR to main — between pushes a freshly-disclosed
# CVE rots the gate silently (this has happened three times: May, June, and
# again by July 2026). This job re-runs the SAME audit commands every Monday so
# rot is caught in days, not on the next unrelated push.
#
# The pip-audit / pnpm audit steps below are byte-identical to ci.yml's
# security-scan equivalents — keep the two in sync so the scheduled gate and
# the push gate can never disagree. On failure this workflow goes red; the
# maintainer watches the Actions tab. Set the optional NTFY_URL secret (a full
# ntfy topic URL) to also get a failure ping — absent it, this stays red-only.

on:
  schedule:
    - cron: "0 14 * * 1" # Mondays 14:00 UTC
  workflow_dispatch:

jobs:
  dep-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Audit dependencies
        run: uv run pip-audit --ignore-vuln CVE-2025-69872  # diskcache 5.6.3 — no fix available yet

      # pnpm audit requires v11+: npm retired the legacy /security/audits{,/quick}
      # endpoints (410 since 2026-04) and pnpm moved to the bulk advisory endpoint
      # (/security/advisories/bulk) in v11 (pnpm/pnpm#11268), so v10 audit is
      # permanently broken. Pinned ahead of the app's pnpm 10 on purpose — audit
      # only reads pnpm-lock.yaml (never installs), so the v10 lockfile is read fine.
      # pnpm 11.13+ needs the node:sqlite builtin (Node >=22.5), so pin Node 24 here.
      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Audit npm dependencies (high/critical only)
        working-directory: frontend
        run: pnpm audit --prod --audit-level high

      # Failure ping. Optional: set the NTFY_URL secret (a full ntfy topic URL) on
      # the private repo to get a push notification when this audit goes red. Absent
      # the secret (public forks) this warns-and-skips — mirrors the secret-gating
      # house style of ci.yml's "Materialize PII patterns" step. The URL is a secret,
      # so it is never echoed; GitHub masks it in logs regardless.
      - name: Notify on failure (ntfy, optional)
        if: failure()
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$NTFY_URL" ]; then
            echo "::notice::Failure notification skipped — no NTFY_URL secret set"
            exit 0
          fi
          curl -s \
            -H "Title: Dependency audit failed" \
            -H "Priority: high" \
            -H "Tags: warning" \
            -d "The dependency audit workflow failed in ${{ github.repository }}. Review the run: ${RUN_URL}" \
            "$NTFY_URL" > /dev/null
