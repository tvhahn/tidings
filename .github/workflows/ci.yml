name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Unit tests with coverage
        # The pytest invocation and coverage floor live in one place: `make test-ci`.
        run: make test-ci
        env:
          AWS_DEFAULT_REGION: us-west-2

  integration-tests:
    runs-on: ubuntu-latest
    if: ${{ vars.RUN_INTEGRATION_TESTS == 'true' }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Integration tests
        run: uv run pytest tests/integration/ -m integration -v --no-cov
        env:
          AWS_DEFAULT_REGION: us-west-2
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

  openapi-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Regenerate openapi.json
        run: make openapi

      - name: Fail on drift
        run: git diff --exit-code openapi.json

  frontend-codegen-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate generated types
        run: pnpm codegen

      - name: Fail on drift
        run: git diff --exit-code src/types/api.generated.ts

  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

      - name: TypeScript
        run: pnpm exec tsc -b

      - name: Prettier
        run: pnpm format:check

  # frontend-slop — ui-slop-audit v2 deterministic de-slop gate. GATE FLIPPED 2026-07-11 (D4):
  # the one live P0 (StatementReview.tsx sticky-bar backdrop-blur) was triaged (solid
  # bg-background) and the tree is P0-clean, so this job now BLOCKS on any P0. Mirrors the P0
  # gate in `make verify-frontend`; keep the two in sync. Dep-free plain Node (no pnpm install),
  # run from the repo root because the script path is repo-relative.
  frontend-slop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: De-slop P0 gate (blocking)
        run: node .claude/skills/ui-slop-audit/scripts/slop-grep.mjs frontend/src --fail-on=P0

  # Mirrors `make verify-docs`; dep-free plain Node, run from the repo root. Keeps the
  # docs/app/screenshot-pipeline drift gate on CI, where a skipped local verify can't bypass it.
  docs-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Docs coverage gate (pages, sidebar + llms-txt, screenshots)
        run: node scripts/checks/check_docs_coverage.mjs

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Vitest (with coverage thresholds)
        run: pnpm run test:coverage

  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Ruff check
        run: uv run ruff check src/ tests/

      - name: Ruff format
        run: uv run ruff format --check src/ tests/

      - name: Test-convention ratchet (ad-hoc TestClient ban)
        run: uv run python scripts/checks/check_test_conventions.py

      - name: Pyright
        run: uv run pyright src/

      - name: Deptry (dependency hygiene)
        run: uv run deptry src/

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build --platform linux/amd64 -f docker/email_parsing/Dockerfile -t test-build .

      - name: Smoke test — verify handler imports
        run: docker run --rm --entrypoint python test-build -c "from lambda_function import handler; print('OK')"

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Audit dependencies
        run: uv run pip-audit --ignore-vuln CVE-2025-69872  # diskcache 5.6.3 — no fix available yet

      # pnpm audit requires v11+: npm retired the legacy /security/audits{,/quick}
      # endpoints (410 since 2026-04) and pnpm moved to the bulk advisory endpoint
      # (/security/advisories/bulk) in v11 (pnpm/pnpm#11268), so v10 audit is
      # permanently broken. Pinned ahead of the app's pnpm 10 on purpose — audit
      # only reads pnpm-lock.yaml (never installs), so the v10 lockfile is read fine.
      # pnpm 11.13+ needs the node:sqlite builtin (Node >=22.5), so pin Node 24 here.
      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Audit npm dependencies (high/critical only)
        working-directory: frontend
        run: pnpm audit --prod --audit-level high

      - name: Materialize PII patterns
        env:
          PII_PATTERNS: ${{ secrets.PII_PATTERNS }}
        run: if [ -n "$PII_PATTERNS" ]; then printf '%s\n' "$PII_PATTERNS" > .pii-patterns; fi

      - name: PII scan
        run: |
          # Personal-identifier scan. The maintainer's token alphabet lives in
          # .pii-patterns (untracked — gitignored, so it never ships to the public
          # tree; materialized above from the PII_PATTERNS secret on the private
          # repo). Public forks have no secret, so the file is absent and this step
          # warns-and-skips; the authoritative pre-push gate is
          # scripts/pii/audit_oss_release.py. Case-insensitive: real-data leaks often
          # show up as ALL-CAPS payees in e-transfer descriptions.
          if [ ! -f .pii-patterns ]; then
            echo "::warning::PII personal-token scan SKIPPED — no .pii-patterns/secret"
            exit 0
          fi
          # Prove the alphabet is armed before trusting it: reject an
          # uncompilable / empty-matching / duplicate / comment-trapped pattern
          # file, and enforce a floor on the live pattern count so a stale or
          # truncated secret can't shrink the alphabet unnoticed. Line numbers
          # only — the linter never echoes pattern content.
          python3 scripts/pii/lint_pii_patterns.py --patterns .pii-patterns --min-count 120
          # Strip surrounding whitespace per line — a stray trailing space would
          # silently corrupt the regex alternative it sits on.
          patterns=$(grep -vE '^[[:space:]]*(#|$)' .pii-patterns | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' | paste -sd'|' -)
          # Self-test: assemble the canary at runtime (concatenation — the joined
          # literal never sits in the tree) and prove the assembled alphabet
          # actually catches it. A green scan over nothing is the failure this guards.
          canary="TIDINGS-PII-"
          canary="${canary}CANARY"
          if ! printf '%s' "$canary" | grep -qiE "$patterns"; then
            echo "::error::PII gate self-test failed — assembled pattern set does not catch the canary"
            exit 1
          fi
          # Attribution allowlist, mirroring scripts/pii/audit_oss_release.py: a token
          # on a line with a github.com/<owner> URL (escaped regex form included —
          # the pre-push hook's remote-allowlist tests) is public attribution, not
          # a leak. Keep the two allowlists in sync.
          #
          # Scope: the ENTIRE tracked tree (':/'), not the old six-path list. Past
          # leaks sat in frontend/src/lib/, outside that list; the orchestrator
          # verified this session that widening to the full tree yields zero
          # surviving matches (after the attribution filter) against the current
          # alphabet, so the wider scan is safe and final.
          matches=$(git grep -iE "$patterns" -- ':/' | grep -viE 'github\\?\.com|ghcr\.io|Copyright|SPDX-FileCopyrightText' || true)
          if [ -n "$matches" ]; then
            echo "ERROR: Personal identifiers found in source or config files"
            printf '%s\n' "$matches"
            exit 1
          fi
          echo "PII scan passed"

  # Validates the tree that the PUBLIC repo actually receives — the full tracked
  # tree, which is exactly what `git archive` emits (there is no .gitattributes /
  # export-ignore in this repo; untracked files like .pii-patterns are simply
  # absent because they were never tracked). Catches the class of bug where a file
  # referenced by the build or docs exists as an untracked/private working-tree
  # file (e.g. Dockerfile.prod once COPY'd dev/cli/, which was never committed).
  public-tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Extract the public tree (git archive)
        run: |
          mkdir -p /tmp/public-tree
          git archive HEAD | tar -x -C /tmp/public-tree
          echo "$(find /tmp/public-tree -type f | wc -l) files in the public tree"

      - name: Materialize PII patterns
        env:
          PII_PATTERNS: ${{ secrets.PII_PATTERNS }}
        run: if [ -n "$PII_PATTERNS" ]; then printf '%s\n' "$PII_PATTERNS" > .pii-patterns; fi

      - name: PII gate self-test
        # Proves the gate is armed: lints the alphabet and runs a runtime-assembled
        # canary through audit_oss_release.py, asserting it is caught. Fork-safe —
        # with no secret the patterns file is absent and the script skips green.
        run: bash scripts/pii/check_pii_gate_armed.sh

      - name: PII audit of the public tree
        run: |
          # Exit 1 = blocking hits; exit 0/2 (clean / review-only) pass.
          # The auditor resolves .pii-patterns from this private checkout (written
          # above from the PII_PATTERNS secret); in a public fork with no secret it
          # falls back to the generic credential/email/phone scans and prints a
          # loud "project-token scan SKIPPED" warning.
          set +e
          python3 scripts/pii/audit_oss_release.py --target /tmp/public-tree
          code=$?
          set -e
          if [ "$code" -eq 1 ]; then
            echo "::error::PII audit found blocking hits in the public tree."
          fi
          [ "$code" -ne 1 ]

      - name: README + INSTALL relative links resolve in the public tree
        run: |
          python3 - <<'PY'
          import re, sys
          from pathlib import Path

          tree = Path("/tmp/public-tree")
          broken = []
          for doc in ("README.md", "INSTALL.md", "CONTRIBUTING.md"):
              path = tree / doc
              if not path.exists():
                  broken.append(f"{doc}: file itself missing from the public tree")
                  continue
              for target in re.findall(r"\]\(([^)#\s]+)\)", path.read_text()):
                  if re.match(r"^(https?:|mailto:|<)", target):
                      continue
                  if not (tree / target.removeprefix("./")).exists():
                      broken.append(f"{doc} -> {target}")
          if broken:
              print("Broken relative links in the public tree:")
              print("\n".join(f"  {b}" for b in broken))
              sys.exit(1)
          print("all relative links resolve")
          PY

      # Canon link check — broken links/paths in the agent-facing context files, unmarked
      # references into the git-excluded docs/specs/ tree, missing AGENTS.md symlinks.
      # Run on both trees: the private checkout (where docs/specs exists) and the public
      # tree (where it doesn't). Mirrors `make verify-canon`; keep the two in sync.
      - name: Canon links + context-file symlinks (both trees)
        run: |
          python3 scripts/checks/check_canon_links.py --root .
          python3 scripts/checks/check_canon_links.py --root /tmp/public-tree

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Public tree builds (Dockerfile.prod)
        uses: docker/build-push-action@v7
        with:
          context: /tmp/public-tree
          file: /tmp/public-tree/Dockerfile.prod
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=public-tree
          cache-to: type=gha,mode=max,scope=public-tree
