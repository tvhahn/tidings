allowBuilds:
  esbuild: true
  sharp: true
  vue-demi: true

# vite is transitive-only here (via Astro); Dependabot can't bump transitives
# in pnpm, so security floors must be pinned as overrides.
overrides:
  vite: '>=7.3.5'
  esbuild: '>=0.28.1'
  shell-quote: '>=1.8.4'
  devalue: '>=5.8.1'
  sharp: '>=0.35.0'
  dompurify: '>=3.4.12'
  svgo: '>=4.0.2'
  "@babel/core": '>=7.29.6 <8'
  js-yaml: '>=4.3.1 <5'
  nanoid@3: '>=3.3.17 <4'
  nanoid@5: '>=5.1.16 <6'
  postcss: '>=8.5.23 <9'
